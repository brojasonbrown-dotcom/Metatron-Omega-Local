# AVA — electron-builder configuration (Windows .exe packaging)
# Docs-aligned: electron-builder.yml is read automatically by electron-builder.
appId: com.rhuft.ava
productName: AVA
copyright: RHUFT Project 2026

directories:
  output: release
  buildResources: build

asar: true

# Ship exactly what the app needs: main process, renderer, package manifest.
# engine-bundle.cjs is prebuilt via `npm run bundle:engine` before packing.
files:
  - electron/**
  - renderer/**
  - package.json

# The v14 MIND (source-only) ships as plain files at resources/brain v14 —
# exactly where mindService's resolution chain looks. The mind runs on the
# SYSTEM Node (≥25, type-stripping), so these must NOT be inside the asar.
# EXCLUDED (deliberately): blobs/ (5.4 GB re-pullable model weights — a
# machine-level resource), node_modules/ + dist/ + tests/ (dev-only),
# mind_state/ (learned state starts fresh per machine, auto-created).
# parallel/ MUST ship: fractal_node_engine.ts imports ParallelEngine at
# module scope, so a package without it crashes the mind on boot (P3).
extraResources:
  - from: "../brain v14"
    to: "brain v14"
    filter:
      - "*.ts"
      - adapters/**
      - cognition/**
      - parallel/**
      - schemas/**
      - core/**
      - manifests/**
      - "!**/*.test.ts"
      - "!**/WOlfram nt.txt"
      - "!**/FIXES.md"
      - "!**/*.log"

win:
  executableName: AVA
  artifactName: AVA-${version}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AVA
  deleteAppDataOnUninstall: false
  artifactName: AVA-${version}-setup.${ext}

portable:
  artifactName: AVA-${version}-portable.${ext}
