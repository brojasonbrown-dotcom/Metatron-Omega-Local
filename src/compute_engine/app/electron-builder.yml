# METATRON Ω — electron-builder configuration (Windows .exe packaging)
appId: com.metatron.omega
productName: METATRON-OMEGA
copyright: METATRON Project 2026

# Local portable/NSIS distribution only — NO auto-update server (see prior note:
# without publish:null, electron-builder infers a provider from the git remote and
# fails the dist step after signing).
publish: null

directories:
  output: release
  buildResources: build

asar: true

# Ship exactly what the app needs: main process, renderer, package manifest.
# omega-bundle.cjs is prebuilt via `npm run bundle:omega` before packing.
files:
  - electron/**
  - renderer/**
  - package.json

win:
  executableName: METATRON-OMEGA
  artifactName: METATRON-OMEGA-${version}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: METATRON-OMEGA
  deleteAppDataOnUninstall: false
  artifactName: METATRON-OMEGA-${version}-setup.${ext}

portable:
  artifactName: METATRON-OMEGA-${version}-portable.${ext}
