# AVA — electron-builder configuration (Windows .exe packaging)
# Docs-aligned: electron-builder.yml is read automatically by electron-builder.
appId: com.rhuft.ava
productName: AVA
copyright: RHUFT Project 2026

# Local portable/NSIS distribution only — NO auto-update server. Without this,
# electron-builder's update-info builder infers a publish provider from the git
# remote; when the remote isn't readable from the packaged subfolder it resolves
# to null and computeChannelNames dereferences null.channel ("Cannot read
# properties of null"), failing the dist step AFTER signing succeeds. Declaring
# `publish: null` (the honest "no provider") skips update-info generation, so the
# NSIS installer + portable exe build cleanly. [BUILD FIX 2026-08-17]
publish: null

directories:
  output: release
  buildResources: build

asar: true

# Ship exactly what the app needs: main process, renderer, package manifest.
# engine-bundle.cjs is prebuilt via `npm run bundle:engine` before packing.
files:
  - electron/**
  - renderer/**
  - package.json

# The v14 MIND (source-only) ships as plain files at resources/brain v14 —
# exactly where mindService's resolution chain looks. The mind runs on the
# SYSTEM Node (≥25, type-stripping), so these must NOT be inside the asar.
# EXCLUDED (deliberately): blobs/ (5.4 GB re-pullable model weights — a
# machine-level resource), node_modules/ + dist/ + tests/ (dev-only),
# mind_state/ (learned state starts fresh per machine, auto-created).
# parallel/ MUST ship: fractal_node_engine.ts imports ParallelEngine at
# module scope, so a package without it crashes the mind on boot (P3).
extraResources:
  - from: "../brain v14"
    to: "brain v14"
    filter:
      - "*.ts"
      - "package.json"
      - adapters/**
      - cognition/**
      - parallel/**
      - schemas/**
      - core/**
      - manifests/**
      - "!**/*.test.ts"
      - "!**/WOlfram nt.txt"
      - "!**/FIXES.md"
      - "!**/*.log"
  # The v14 mind cross-imports the verified ENGINE tree (M4/M5 fusion:
  # brain v14/core/constants.ts + the spectral senses reach ../../engine/src/**).
  # Those are RELATIVE source imports, so the engine source MUST ship beside the
  # brain at resources/engine/src or the sidecar dies at module-load (EPIPE on the
  # host). Source-only, type-stripped by the same system Node — never asar'd.
  - from: "../engine/src"
    to: "engine/src"
    filter:
      - "**/*.ts"
      - "!**/*.test.ts"
  # engine/package.json carries "type":"module" — the ESM context Node's
  # type-stripping resolver needs to map the engine's internal .js-extension
  # imports onto the shipped .ts files. Without it the resolver demands exact
  # file URLs and the mind dies at module link (ERR_MODULE_NOT_FOUND lucas.js).
  - from: "../engine/package.json"
    to: "engine/package.json"

win:
  executableName: AVA
  artifactName: AVA-${version}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AVA
  deleteAppDataOnUninstall: false
  artifactName: AVA-${version}-setup.${ext}

portable:
  artifactName: AVA-${version}-portable.${ext}
