<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>METATRON Ω — Toroidal Brain Interface</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="rain" aria-hidden="true"></canvas>

    <main id="app">
      <header id="bar">
        <div class="brand">
          <span class="dot"></span>
          <h1>METATRON</h1>
          <span class="tag">OMEGA&nbsp;BRAIN</span>
        </div>
        <p class="sub">18-rung dense core · certified toroidal engine · every answer computed live · nothing canned</p>
      </header>

      <section id="log" aria-live="polite"></section>

      <form id="composer" autocomplete="off">
        <span id="prompt">&gt;</span>
        <textarea
          id="input"
          rows="1"
          placeholder="talk to the brain…  (help · status · ladder · memory · mind)"
          autofocus
        ></textarea>
        <button id="send" type="submit" aria-label="send">➤</button>
      </form>
    </main>

    <aside id="stab" class="hidden" aria-label="brain telemetry">
      <h2>BRAIN TELEMETRY</h2>
      <div id="stab-body">
        <p class="stab-dim">brain idle — press ⏻ to wake it</p>
      </div>
    </aside>

    <div id="camprev" class="hidden">
      <video id="camvideo" autoplay muted playsinline></video>
    </div>

    <div id="drop" aria-hidden="true">
      <div class="drop-box">
        <span class="drop-glyph">⤓</span>
        <p>drop a document to feed the brain</p>
        <p class="drop-sub">txt · md · json · csv · pdf (text layer) — read in the main process, never the sandbox</p>
      </div>
    </div>

    <nav id="fab" aria-label="controls">
      <button id="fab-engine" title="engine start / stop">⏻</button>
      <button id="fab-stab" title="brain telemetry">Σ</button>
      <button id="fab-mic" title="microphone">🎙</button>
      <button id="fab-cam" title="camera">📷</button>
    </nav>

    <script src="rain.js"></script>
    <script src="chat.js"></script>
    <script src="sensors.js"></script>
    <script src="fab.js"></script>
  </body>
</html>
